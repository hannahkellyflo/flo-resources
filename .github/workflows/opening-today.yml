name: Opening-today heads-up for Juli

# Posts to #forward-job-postings the tracked jobs opening on the NEXT weekday that aren't live on
# Flo Forward yet (the ones Juli needs to add). Monday delivery also sweeps Sat/Sun. Point-in-time
# read of data.json; no watermark/state. Zero openings -> a clear "no intel" note.
#
# Timing: runs the EVENING BEFORE (23:00 UTC Sun-Thu) and schedules the Slack message for 8:00 AM
# America/Chicago the next weekday via chat.scheduleMessage (DST-correct). GitHub cron fires 4-7h
# late and unpredictably, so a same-morning run can't reliably beat 8 AM; running the night before
# gives ~9-14h of slack, so even a very late run still schedules for (and lands at) 8 AM CT.
# 23:00 UTC Sun-Thu -> delivers Mon-Fri. opening_today.py --now sends immediately for manual catch-up.
#
# Pause: opening_today.py has a RESUME_ON date guard (currently past). The workflow stays enabled.
on:
  schedule:
    - cron: "0 23 * * 0-4"   # 23:00 UTC Sun-Thu (evening before) -> 8 AM CT Mon-Fri delivery
  workflow_dispatch: {}

jobs:
  heads-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # default depth is fine — point-in-time read, no diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post opening-today heads-up to #forward-job-postings
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python digest/opening_today.py

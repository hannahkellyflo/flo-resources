name: Refresh Legal Recruiting Tracker

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 7:00 AM ET (11:00 UTC) on weekdays
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate data.json from live sources
        working-directory: pipeline
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 generate.py

      - name: Rebuild index.html
        working-directory: pipeline
        run: python3 build.py

      - name: Commit if changed
        run: |
          git config user.name "flo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/data.json site/tracker/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh legal recruiting tracker data [skip ci]"
            git push
          fi
